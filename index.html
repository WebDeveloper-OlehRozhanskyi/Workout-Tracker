<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
   rel="icon"
   type="image/png"
   href="/favicon/favicon-96x96.png"
   sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link
   rel="apple-touch-icon"
   sizes="180x180"
   href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <title>Workout Tracker</title>
 </head>
 <body>
  <header class="header"></header>
  <main class="main">
   <section class="workout">
    <div class="workout__container">
     <h1 class="workout__title">Workout Tracker</h1>
     <details class="workout__details">
      <summary>Equipment</summary>
      <table class="workout__equipment">
       <thead>
        <tr>
         <th>Name</th>
         <th>Load</th>
        </tr>
       </thead>
       <tbody>
        <tr>
         <td>Yellow</td>
         <td>1-5 kg</td>
        </tr>
        <tr>
         <td>Red</td>
         <td>6-10 kg</td>
        </tr>
        <tr>
         <td>Green (thin)</td>
         <td>11-19 kg</td>
        </tr>
        <tr>
         <td>Black</td>
         <td>12-17 kg</td>
        </tr>
        <tr>
         <td>Purple</td>
         <td>17-26 kg</td>
        </tr>
        <tr>
         <td>Green (wide)</td>
         <td>26-36 kg</td>
        </tr>
        <tr>
         <td>Blue</td>
         <td>36-48 kg</td>
        </tr>
        <tr>
         <td>Vest</td>
         <td>15 kg</td>
        </tr>
       </tbody>
      </table>
     </details>
     <details class="workout__details">
      <summary>Add exercise</summary>
      <form class="workout__form">
       <label class="workout__label">
        Exercise name:
        <input
         class="workout__input"
         type="text"
         name="exercise-name"
         required />
       </label>
       <label class="workout__label">
        Reps:
        <input
         class="workout__input"
         type="number"
         name="exercise-reps"
         min="1"
         step="1"
         required />
       </label>

       <label class="workout__label">
        Load:
        <input
         class="workout__input"
         type="text"
         name="exercise-load"
         required />
       </label>
       <label class="workout__label">
        Note:
        <input class="workout__input" type="text" name="exercise-note" />
       </label>
       <button class="workout__button" type="submit">Add</button>
      </form>
     </details>
     <ul class="workout__exercises-list"></ul>
     <p class="workout__summary"></p>
    </div>
   </section>
  </main>
  <footer class="footer"></footer>
  <script type="module" src="./src/main.js"></script>
 </body>
</html>
